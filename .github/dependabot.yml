version: 2
registries:
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    # Secret do Dependabot (Settings → Secrets and variables → Dependabot),
    # separado do secret do environment `envs` usado pelo deploy.
    token: ${{ secrets.GH_MATHEUS_MOTA_UI }}
updates:
  # Só o design system: cada versão nova publicada vira um PR, que o
  # dependabot-auto-merge.yml mergeia e publica.
  - package-ecosystem: npm
    directory: "/"
    registries:
      - github-npm
    schedule:
      interval: daily
    allow:
      - dependency-name: "@matheusmota-dev-br/ui"
    commit-message:
      prefix: "chore(deps)"
