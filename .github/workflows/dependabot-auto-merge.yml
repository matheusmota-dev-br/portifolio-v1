name: Dependabot auto-merge

# Atualizações do design system entram sozinhas: o PR do Dependabot é
# mergeado e o deploy é disparado na sequência. Se o build quebrar, o deploy
# falha e o site continua na versão anterior.
on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Merge and deploy
        if: steps.metadata.outputs.dependency-names == '@matheusmota-dev-br/ui'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --squash --delete-branch "$PR_URL"
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref master
