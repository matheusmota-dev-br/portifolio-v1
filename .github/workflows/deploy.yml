name: Deploy to GitHub Pages

# Builda o site (Vite + @matheusmota-dev-br/ui, privado no GitHub Packages) e
# publica no Pages. O token de leitura do pacote mora no environment `envs`.
on:
  push:
    branches:
      - master
  # Disparado também pelo auto-merge do Dependabot: merges feitos com o
  # GITHUB_TOKEN não geram evento de push.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: envs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GH_MATHEUS_MOTA_UI: ${{ secrets.GH_MATHEUS_MOTA_UI }}

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
