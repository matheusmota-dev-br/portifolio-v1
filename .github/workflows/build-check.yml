name: Build check

# O mesmo build do deploy, em todo PR. É o check exigido pela regra do master:
# sem ele verde, o PR não pode ser mergeado.
on:
  pull_request:
    branches:
      - master

jobs:
  build-check:
    runs-on: ubuntu-latest
    environment: envs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GH_MATHEUS_MOTA_UI: ${{ secrets.GH_MATHEUS_MOTA_UI }}

      - name: Build
        run: pnpm build
